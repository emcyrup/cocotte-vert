# CI/CD: 全ブランチでテスト実行、main へのプッシュで VM へ自動デプロイ。
#
# デプロイの有効化手順（docs/deploy.md にも記載）:
#   1. VM に GitHub Actions 用の SSH 鍵を用意し、公開鍵を ~/.ssh/authorized_keys に追加
#   2. リポジトリの Settings → Secrets and variables → Actions に登録:
#        Secrets:   VM_HOST（IP またはドメイン） / VM_USER / VM_SSH_KEY（秘密鍵の中身）
#        Variables: DEPLOY_ENABLED = true
#   DEPLOY_ENABLED を設定するまでデプロイジョブはスキップされる（テストだけ動く）
#
# 任意の Secret:
#   ANTHROPIC_API_KEY … 登録するとデプロイのたびに VM の .env へ反映する。
#     未登録なら VM の .env はそのまま（既存の値を消さない）。
#   他の値は VM の .env で直接管理する。ここで配るのは、鍵の差し替えを
#   サーバーに入らずに済ませたいものだけに絞っている。
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    # main が更新されたときだけ、テスト成功を条件に VM へ反映する
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-vm   # 同時デプロイを防ぐ
    steps:
      - name: Deploy to VM via SSH
        run: |
          mkdir -p ~/.ssh
          # CR（Windows 改行）を除去し、末尾に改行を保証する
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 秘密鍵として読めるかを SSH 前に検証し、原因を明確にする
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::VM_SSH_KEY が秘密鍵として読めません。deploy_key（秘密鍵）の全文を -----BEGIN/END----- 行込みで Secret に登録してください（.pub は公開鍵なので不可）"
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # 鍵は標準入力で渡す。コマンド引数に入れると VM の ps に見えてしまうため
          printf '%s' "$ANTHROPIC_API_KEY" |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            set -e
            IFS= read -r KEY || true
            cd cocotte-vert
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            # Secret があるときだけ .env を書き換える（未登録なら既存の値を残す）。
            # sed で値を埋め込むと記号で壊れるため、行を消してから printf で足す
            if [ -n "$KEY" ]; then
              touch .env
              grep -v "^ANTHROPIC_API_KEY=" .env > .env.new || true
              printf "ANTHROPIC_API_KEY=%s\n" "$KEY" >> .env.new
              mv .env.new .env
              chmod 600 .env
            fi
            docker compose --profile standalone up -d --build
            sleep 5
            curl -sf http://127.0.0.1:3000/health
          '
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
