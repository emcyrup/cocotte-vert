# CI/CD: 全ブランチでテスト実行、main へのプッシュでサーバーへ自動デプロイ。
#
# 宛先は2つ。**別々の Secret を使う**ので、片方を足すときにもう片方を壊さない。
# 手順は .github/actions/deploy に1つだけ置き、両方から呼んでいる。
#
#   deploy       … 検証環境（GCP・Docker Compose）
#     Secrets:   VM_HOST（IP またはドメイン） / VM_USER / VM_SSH_KEY（秘密鍵の全文）
#     Variables: DEPLOY_ENABLED = true
#                DEPLOY_STYLE   … 既定 docker。Docker の無いサーバーなら plain
#                DEPLOY_PORT    … 既定 3000（docker のヘルスチェック先）
#
#   deploy-prod  … 本番環境（管理会社の共用サーバー。Docker も sudo も無いので plain 固定）
#     Secrets:   PROD_VM_HOST / PROD_VM_USER / PROD_VM_SSH_KEY（配布された .pem の全文）
#     Variables: PROD_DEPLOY_ENABLED = true
#                PROD_DEPLOY_PORT    … 既定 8017（割り当てポート）
#
# それぞれ *_DEPLOY_ENABLED を設定するまでスキップされる（テストだけ動く）。
#
# 任意の Secret:
#   ANTHROPIC_API_KEY … 登録するとデプロイのたびに両サーバーの .env へ反映する。
#     未登録ならサーバーの .env はそのまま（既存の値を消さない）。
#   他の値はサーバーの .env で直接管理する。ここで配るのは、鍵の差し替えを
#   サーバーに入らずに済ませたいものだけに絞っている。
#
# 注意: 両方を動かす場合、**SEND_MODE が live なのは本番だけ**にすること。
#   別々のデータベースを見ているため dedupe_key が効かず、二重で届く。
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # 検証環境（GCP・Docker Compose）。既存の Secret をそのまま使う
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-vm   # 同時デプロイを防ぐ
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.VM_HOST }}
          user: ${{ secrets.VM_USER }}
          ssh-key: ${{ secrets.VM_SSH_KEY }}
          repo-url: ${{ github.server_url }}/${{ github.repository }}.git
          style: ${{ vars.DEPLOY_STYLE || 'docker' }}
          port: ${{ vars.DEPLOY_PORT || '3000' }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  # 本番環境（管理会社の共用サーバー）。検証環境とは別の Secret を使うので、
  # 既存の VM_* を書き換えずに増やせる
  deploy-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PROD_DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          user: ${{ secrets.PROD_VM_USER }}
          ssh-key: ${{ secrets.PROD_VM_SSH_KEY }}
          repo-url: ${{ github.server_url }}/${{ github.repository }}.git
          # 本番は Docker が使えないため plain 固定
          style: plain
          port: ${{ vars.PROD_DEPLOY_PORT || '8017' }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
