# VPS / EC2 用の本番構成: アプリ + PostgreSQL + Caddy（HTTPS 自動化）
# 使い方は docs/deploy.md を参照。
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Tokyo
      # DB はこの compose 内のものを使う（.env の DATABASE_URL より優先される）
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}@db:5432/cocotte_vert
    # 起動前にマイグレーションを適用する
    command: sh -c "node scripts/migrate.js && node src/index.js"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: cocotte_vert
      TZ: Asia/Tokyo
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cocotte_vert"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Let's Encrypt の証明書取得・更新を自動で行うリバースプロキシ
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN を .env に設定してください}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  dbdata:
  caddy_data:
  caddy_config:
