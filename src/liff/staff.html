<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>スタッフ登録</title>
  <style>
    :root { --accent: #06c755; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0; padding: 16px; background: #f7f7f7; color: #222;
      /* 日本語が語中で改行されないようにする */
      word-break: keep-all; overflow-wrap: break-word;
    }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.1rem; margin: 0 0 12px; }
    p.note { font-size: 0.85rem; color: #666; margin-top: 0; line-height: 1.7; }
    #loading { text-align: center; color: #666; font-size: 0.9rem; padding: 24px 0; }
    .hidden { display: none; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 4px; }
    input[type="text"] {
      width: 100%; padding: 12px; font-size: 1rem; font-family: inherit;
      border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #222;
    }
    ul { list-style: none; margin: 12px 0 0; padding: 0; }
    li { margin-bottom: 8px; }
    .pick {
      width: 100%; padding: 14px; font-size: 1rem; font-family: inherit; font-weight: 700;
      text-align: left; color: #222; background: #fff;
      border: 1px solid #ccc; border-radius: 8px;
    }
    button.go {
      width: 100%; margin-top: 20px; padding: 12px; font-size: 1rem; font-weight: 700;
      color: #fff; background: var(--accent); border: none; border-radius: 8px;
    }
    button.go:disabled { background: #aaa; }
    #status { margin-top: 12px; font-size: 0.9rem; text-align: center; line-height: 1.6; }
    #status.error { color: #d00; }
    #status.ok { color: var(--accent); }
    .done { text-align: center; padding: 12px 0; }
    .done .big { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>スタッフ登録</h1>
    <div id="loading">読み込み中…</div>

    <!-- スタッフ用グループにいない人・設定が足りない場合 -->
    <div id="denied" class="hidden">
      <p class="note" id="denied-note"></p>
    </div>

    <!-- 名前を入力する -->
    <div id="pick" class="hidden">
      <p class="note">
        ご自分のお名前を入力してください。<br />
        登録すると、Botとの1対1のトークから<b>シフトの申請</b>と<b>予約の登録</b>ができるようになります。
      </p>
      <p class="note" id="already"></p>
      <label for="name">お名前</label>
      <input type="text" id="name" autocomplete="name" placeholder="例：高橋" maxlength="30" />
      <p class="note" style="margin-top:8px">
        お店に登録されているお名前で入力してください。<br />
        まだ登録がない場合は、入力したお名前で新しく登録します。
      </p>
      <button class="go" id="submit" type="button">この名前で登録する</button>
      <p id="status"></p>
    </div>

    <!-- 同じ名前が複数いたとき -->
    <div id="choose" class="hidden">
      <p class="note">
        同じお名前の方が複数います。<b>ご自分はどちらですか？</b>
      </p>
      <ul id="list"></ul>
      <p id="status2"></p>
    </div>

    <!-- 同じ名前の人が既に登録済みだったとき -->
    <div id="taken" class="hidden">
      <p class="note" id="taken-note"></p>
      <ul>
        <li><button class="pick" id="taken-same" type="button">はい（登録し直します）</button></li>
        <li><button class="pick" id="taken-other" type="button">いいえ、同じ名前の別の人です</button></li>
      </ul>
      <p id="status3"></p>
    </div>

    <!-- 完了 -->
    <div id="done" class="hidden">
      <div class="done">
        <p class="big" id="done-name"></p>
        <p class="note">
          登録が完了しました。<br />
          Botとの1対1のトークに、シフトのご希望や予約をそのまま送ってください。
        </p>
        <p class="note">
          例：<br />
          <b>8/1 有休でお願いします</b><br />
          <b>予約登録 8/20 14時 田中花子 カット</b>
        </p>
      </div>
      <button class="go" id="close" type="button">閉じる</button>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./staff.js"></script>
</body>
</html>
